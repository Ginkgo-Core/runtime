[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ginkgo-runtime"
version = "0.1.0"
description = "Ginkgo Capability Runtime Kernel. Architecture and contracts live in Ginkgo-Core/ai-stack."
requires-python = ">=3.11"
license = { text = "MIT" }
# PyYAML is the only runtime dependency, and it exists for one reason: the
# registries RK-07 projects are YAML. It is the same dependency the P0
# conformance linter in ai-stack already takes for the same reason. No
# framework, no HTTP client, no ORM, no scheduler. See
# docs/adr/ADR-RT-001-implementation-stack.md.
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
# UP031 (%-format -> f-string) is deliberately off. The sibling Python in this
# ecosystem is ai-stack/tools/conformance, which uses %-formatting throughout,
# and RK-10's runtime half is specified as an extension of that suite living in
# this repository. One diagnostic-message style across both is worth more than
# the idiom upgrade. Every other UP rule is on.
ignore = ["UP031"]
