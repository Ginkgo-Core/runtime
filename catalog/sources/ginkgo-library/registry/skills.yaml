principles:
  - Public capability IDs describe semantics and never encode marketplace/provider identity as an implementation detail.
  - Provider-specific records are internal bindings and may retain deprecated aliases only for compatibility.
  - A skill/binding must have explicit inputs, outputs, permissions and intended result.
  - A clipping becomes a skill only after a reproducible action has been validated.
  - Human-assisted surfaces must remain marked as such until an actual autonomous integration exists.
  - New contracts use approval_required; human_approval remains a legacy compatibility field for existing records.
  - Approval and External Gate are independent concerns; Approval cannot clear an External Gate.
  - DISCOVERABLE != ROUTING_ELIGIBLE != PRODUCTION_ELIGIBLE.
  - Marketplace bindings never silently fallback across marketplaces.
  - FEATURE and PRE_APPROVAL records are discoverable metadata, not routable operational skills.