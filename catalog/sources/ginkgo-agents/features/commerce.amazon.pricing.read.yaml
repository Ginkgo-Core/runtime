# Provider Binding Contract — amazon-spapi.pricing.read
id: amazon-spapi.pricing.read
legacy_aliases:
  - id: commerce.amazon.pricing.read
    deprecated: true
    replacement: amazon-spapi.pricing.read
version: 0.1.0
kind: provider_binding
lifecycle_status: FEATURE
maturity: F1
level: L1
autonomy_level: A1
status: feature

purpose: >
  Implement the provider-agnostic commerce.pricing.read capability through an
  Amazon SP-API binding without exposing provider-specific payloads or routing to callers.

capability:
  name: commerce.pricing.read
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: amazon-spapi.pricing.read
  skill_version: 0.1.0
  adapter_id: amazon-spapi
  provider: amazon-selling-partner
  internal_routing_metadata: true

use_when:
  - current_amazon_offer_pricing_required
  - normalized_listing_and_landed_price_required
  - product_evaluation_needs_target_marketplace_price

avoid_when:
  - historical_price_series_required
  - seller_inventory_required
  - caller_requires_live_data_before_provider_validation

inputs:
  required:
    - marketplace_ref
    - identifiers
  optional:
    - condition
    - customer_type
    - pagination.page_token
  forbidden:
    - skill_id
    - skill_version
    - provider
    - adapter
    - endpoint
    - credential
    - secret
    - access_token
    - refresh_token

outputs:
  contract: CapabilityResult v1
  data_contract: amazon-pricing-result.v1
  fields:
    - identifier
    - currency
    - listing_price
    - shipping_price
    - landed_price
    - offers
    - observed_at
    - provenance

permissions:
  external_network: true
  marketplace_read: [amazon.pricing]
  marketplace_write: []
  pii: none
  filesystem_write: none
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: [AMZ_SP_CLIENT_ID, AMZ_SP_CLIENT_SECRET, AMZ_SP_REFRESH_TOKEN, AMZ_SELLER_ID, AMZ_MARKETPLACE_ID]

approval:
  required: false
  status: NOT_REQUIRED

external_gates: []

execution_mode: autonomous
routing:
  routing_eligible: false
  live_execution: blocked
  reason: amazon_sp_api_adapter_not_validated

fallback_policy: none

validation:
  evidence:
    - "Scale-Characters/amazon-ops main:.env.example contains logical SP-API credential references"
    - "Scale-Characters/amazon-ops main has no merged pricing adapter or E2E evidence"
  blockers:
    - no_repository_backed_pricing_adapter
    - no_contract_tests
    - no_live_read_e2e
    - no_price_payload_normalization_evidence

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - merged_read_only_pricing_adapter
    - contract_and_boundary_tests
    - normalized_errors_and_retry_policy
    - one_governed_live_read_e2e
    - evidence_registered_in_github
    - reviewer_approval

owner_domain: commerce
