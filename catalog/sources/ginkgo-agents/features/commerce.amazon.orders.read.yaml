# Provider Binding Contract — amazon-spapi.orders.read
id: amazon-spapi.orders.read
legacy_aliases:
  - id: commerce.amazon.orders.read
    deprecated: true
    replacement: amazon-spapi.orders.read
version: 0.1.0
kind: provider_binding
lifecycle_status: FEATURE
maturity: F1
level: L1
autonomy_level: A1
status: feature

purpose: >
  Implement the provider-agnostic commerce.orders.read capability through an
  Amazon SP-API binding with PII minimization and zero mutation authority.

capability:
  name: commerce.orders.read
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: amazon-spapi.orders.read
  skill_version: 0.1.0
  adapter_id: amazon-spapi
  provider: amazon-selling-partner
  internal_routing_metadata: true

use_when:
  - amazon_order_status_required
  - order_items_or_timestamps_required
  - reconciliation_or_audit_needs_orders

avoid_when:
  - fulfillment_mutation_required
  - buyer_contact_or_address_is_not_necessary
  - caller_requires_live_data_before_provider_validation

inputs:
  required:
    - marketplace_ref
    - query
  optional:
    - query.order_ids
    - query.created_after
    - query.updated_after
    - query.statuses
    - pagination.page_token
  forbidden:
    - skill_id
    - skill_version
    - provider
    - adapter
    - endpoint
    - credential
    - secret
    - access_token
    - refresh_token
    - acknowledge
    - cancel
    - fulfill

outputs:
  contract: CapabilityResult v1
  data_contract: amazon-orders-result.v1
  fields:
    - orders
    - order_id
    - status
    - timestamps
    - items
    - totals
    - fulfillment_channel
    - pii_redaction
    - pagination
    - provenance

permissions:
  external_network: true
  marketplace_read: [amazon.orders]
  marketplace_write: []
  pii: redacted
  restricted_fields: [buyer_identity, shipping_address]
  filesystem_write: none
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: [AMZ_SP_CLIENT_ID, AMZ_SP_CLIENT_SECRET, AMZ_SP_REFRESH_TOKEN, AMZ_SELLER_ID, AMZ_MARKETPLACE_ID]

approval:
  required: false
  status: NOT_REQUIRED

external_gates: []

execution_mode: autonomous
routing:
  routing_eligible: false
  live_execution: blocked
  reason: amazon_sp_api_adapter_not_validated

fallback_policy: none

validation:
  evidence:
    - "Scale-Characters/amazon-ops main:.env.example declares logical SP-API credential references"
  blockers:
    - no_repository_backed_orders_adapter
    - no_pii_redaction_contract_tests
    - no_live_read_e2e
    - no_order_error_normalization_evidence

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - merged_read_only_orders_adapter
    - contract_tests_including_pii_redaction
    - normalized_errors_and_retry_policy
    - one_governed_live_read_e2e
    - evidence_registered_in_github
    - reviewer_approval

owner_domain: commerce
