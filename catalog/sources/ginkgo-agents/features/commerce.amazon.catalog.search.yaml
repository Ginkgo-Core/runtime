# Provider Binding Contract — amazon-spapi.catalog.search
id: amazon-spapi.catalog.search
legacy_aliases:
  - id: commerce.amazon.catalog.search
    deprecated: true
    replacement: amazon-spapi.catalog.search
version: 0.1.0
kind: provider_binding
lifecycle_status: FEATURE
maturity: F1
level: L1
autonomy_level: A1
status: feature

purpose: >
  Implement the provider-agnostic commerce.catalog.search capability through an
  Amazon SP-API binding without exposing provider routing or credentials to callers.

capability:
  name: commerce.catalog.search
  contract_version: v1

caller_contract:
  request: CapabilityRequest v1
  request_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-request.schema.json
  result: CapabilityResult v1
  result_schema_ref: Ginkgo-Core/ai-stack/contracts/core/capability-result.schema.json
  caller_selects: [capability.name, capability.contract_version]
  domain_router_resolves: [skill_id, skill_version, adapter, provider]

implementation_binding:
  skill_id: amazon-spapi.catalog.search
  skill_version: 0.1.0
  adapter_id: amazon-spapi
  provider: amazon-selling-partner
  internal_routing_metadata: true

use_when:
  - amazon_catalog_discovery_required
  - asin_or_identifier_resolution_required
  - normalized_product_metadata_required

avoid_when:
  - seller_inventory_state_required
  - offer_or_buybox_pricing_required
  - order_data_required
  - caller_requires_live_data_before_provider_validation

inputs:
  required:
    - marketplace_ref
    - criteria
  optional:
    - criteria.keywords
    - criteria.identifiers
    - criteria.brand
    - criteria.category
    - pagination.page_size
    - pagination.page_token
  forbidden:
    - skill_id
    - skill_version
    - provider
    - adapter
    - endpoint
    - credential
    - secret
    - access_token
    - refresh_token

outputs:
  contract: CapabilityResult v1
  data_contract: amazon-catalog-result.v1
  fields:
    - items
    - identifiers
    - title
    - brand
    - category
    - attributes
    - images
    - pagination
    - provenance

permissions:
  external_network: true
  marketplace_read: [amazon.catalog]
  marketplace_write: []
  pii: none
  filesystem_write: none
  shell: false
  secrets:
    caller_access: forbidden
    adapter_managed_refs: [AMZ_SP_CLIENT_ID, AMZ_SP_CLIENT_SECRET, AMZ_SP_REFRESH_TOKEN, AMZ_SELLER_ID, AMZ_MARKETPLACE_ID]

approval:
  required: false
  status: NOT_REQUIRED

external_gates: []

execution_mode: autonomous
routing:
  routing_eligible: false
  live_execution: blocked
  reason: amazon_sp_api_adapter_not_validated

fallback_policy: none

validation:
  evidence:
    - "Scale-Characters/amazon-ops main:.env.example declares logical SP-API credential names only"
    - "Scale-Characters/amazon-ops main:PLANO.md keeps SP-API in a future integration phase"
  blockers:
    - no_repository_backed_amazon_sp_api_adapter
    - no_contract_tests
    - no_read_only_live_e2e
    - no_normalized_error_evidence

promotion:
  allowed: false
  lifecycle_ceiling: FEATURE
  requires:
    - merged_read_only_adapter
    - contract_and_invalid_input_tests
    - normalized_errors_and_retry_policy
    - secret_scan
    - one_governed_read_only_live_e2e
    - evidence_registered_in_github
    - reviewer_approval

owner_domain: commerce
