name: CI

# Capability Runtime Kernel CI.
#
# Runs only code and pinned fixtures from this repository. No credentials, no
# secrets, no Docker, no provider, no deployment, and no network access beyond
# `checkout` and the pinned dev tooling install. In particular the catalog build
# itself opens no socket: its sources are vendored at explicit commit SHAs, so
# there is no live registry to fetch.
#
# Shape deliberately mirrors ai-stack's `p0-conformance.yml`: read-only
# permissions, SHA-pinned actions, a hard timeout, and no `paths:` filter -- a
# filter meant a pull request touching something outside the globs did not
# trigger the check that needed to run.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Runtime Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install the single runtime dependency
        run: pip install --no-deps -r requirements.txt

      - name: Assert the kernel needs nothing else
        run: |
          python - <<'PY'
          import sys
          # PyYAML is the one permitted dependency (ADR-RT-001). Block the usual
          # suspects so an accidental import cannot pass unnoticed.
          for name in ("requests", "httpx", "jsonschema", "pytest", "pydantic"):
              sys.modules[name] = None
          sys.path.insert(0, "src")
          import ginkgo_runtime.catalog.build   # noqa: F401  RK-07
          import ginkgo_runtime.bus             # noqa: F401  RK-01
          import ginkgo_runtime.router          # noqa: F401  RK-02
          print("kernel imports with stdlib + PyYAML only")
          PY

      - name: Build the catalog
        run: PYTHONPATH=src python -m ginkgo_runtime.catalog build

      - name: Rebuild must be byte-identical
        run: PYTHONPATH=src python -m ginkgo_runtime.catalog verify

      - name: Committed artifacts must match a fresh build
        run: PYTHONPATH=src python -m ginkgo_runtime.catalog emit --check

      - name: The build must open no socket
        run: |
          python - <<'PY'
          import socket, sys
          sys.path.insert(0, "src")

          def blocked(*args, **kwargs):
              raise AssertionError("the catalog build attempted network I/O")

          socket.socket = blocked
          socket.create_connection = blocked
          from ginkgo_runtime.catalog.build import build_catalog
          catalog = build_catalog()
          print("built offline: %s" % catalog.catalog_version)
          PY

      - name: The Capability Bus validates against the pinned contracts only
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from ginkgo_runtime.bus import CapabilityBus, DeterministicDownstream
          bus = CapabilityBus.from_pinned_contracts(DeterministicDownstream())
          # Every frozen value the Bus admits against is read from a pinned
          # schema. Loading raises if any of them is unreadable, so reaching
          # this line at all is the assertion.
          print("contract_version=%s pattern=%s"
                % (bus.contracts.supported_contract_version,
                   bus.contracts.capability_name_pattern))
          PY

      - name: Migration backlog
        if: always()
        run: PYTHONPATH=src python -m ginkgo_runtime.catalog reject

  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned tooling
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest tests -q
